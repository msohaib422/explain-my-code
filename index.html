<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ExplainMyCode — Visual Code Execution. See how JavaScript code runs, step by step." />
    <meta name="theme-color" content="#0d1117" />
    <title>ExplainMyCode — Visual Code Execution</title>
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var isDark = theme === 'dark';
        document.documentElement.style.backgroundColor = isDark ? '#0d1117' : '#ffffff';
        document.documentElement.style.color = isDark ? '#e6edf3' : '#1f2328';
        if (isDark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1117');
        } else {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        }
      })();
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0d1117; color: #e6edf3;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #ffffff; color: #1f2328;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
